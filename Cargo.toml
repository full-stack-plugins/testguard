[package]
name = "testguard"
default-run = "testguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
roxmltree = "=0.20.0"
schemars = "=0.8.22"
guardengine = { path = "../guardengine", version = "=0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
path = "src/lib.rs"
